name: python release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+.post[0-9]+"

permissions:
  contents: write

jobs:
  create-release:
    name: create-release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Get the release version from the tag
        if: env.VERSION == ''
        run: echo "VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
    outputs:
      version: ${{ env.VERSION }}

  linux:
    runs-on: ubuntu-22.04
    needs: ["create-release"]

    strategy:
      matrix:
        target: [x86_64, aarch64]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --manifest-path pywellen/Cargo.toml --out dist --find-interpreter
          sccache: "true"
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}-py${{ matrix.python-version }}
          path: dist

  macos:
    runs-on: macos-latest
    needs: ["create-release"]
    strategy:
      matrix:
        target: [x86_64, aarch64]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --manifest-path pywellen/Cargo.toml --out dist --find-interpreter
          sccache: "true"
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}-py${{ matrix.python-version }}
          path: dist

  pyodide:
    runs-on: ubuntu-22.04
    needs: ["create-release"]
    strategy:
      matrix:
        pyodide-version: ["20260401"]
    env:
      PYODIDE_XBUILDENV_VERSION: ${{ matrix.pyodide-version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"
          targets: wasm32-unknown-emscripten
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Build Pyodide wheel
        run: ./scripts/build-pyodide.sh
      - name: Smoke test wheel in Pyodide
        run: ./pywellen/scripts/pyodide-smoke-test.sh
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-pyodide-${{ matrix.pyodide-version }}
          path: target/pyodide-wheels

  sdist:
    # switch back to ubuntu-22.04 once this issue is resolved:
    # https://github.com/PyO3/maturin-action/issues/291
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --manifest-path pywellen/Cargo.toml --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-22.04
    if: "startsWith(github.ref, 'refs/tags/')"
    needs: [linux, macos, pyodide, sdist]
    steps:
      - uses: actions/download-artifact@v8
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing wheels-*/*
